[package]
name = "xccode-tui"
description = "The full-screen TUI (T.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
opentui.workspace = true
xccode-api.workspace = true
xccode-local.workspace = true
xccode-ui.workspace = true
xccode-store.workspace = true
xccode-plugin.workspace = true
xccode-drive.workspace = true
xccode-util = { workspace = true, features = ["ring"] }
base64.workspace = true
futures-util.workspace = true
indexmap.workspace = true
log.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
unicode-width.workspace = true
url.workspace = true
rand.workspace = true

[features]
# TypeScript TUI plugins on the JS host: the pipe carrier, the JS host and its embedded `host.ts` and `compat.js`
# (ts-feature). On by default; `XCCODE_PLUGIN_JS=0` still turns the host off at run time.
default = ["ts", "luau"]
ts = ["xccode-plugin/ts"]
# Luau plugins, in process. On by default; `XCCODE_PLUGIN_LUAU=0` turns them off at run time.
luau = ["xccode-plugin/luau"]

[dev-dependencies]
bytes.workspace = true
xccode-latex.workspace = true
xccode-mermaid.workspace = true
xccode-parity.workspace = true
# The board plugin's source, linked into the carrier tests as a plugin crate links it.
xccode-plugin-abi.workspace = true
