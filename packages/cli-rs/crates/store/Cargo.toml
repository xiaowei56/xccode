[package]
name = "xiaochuan-store"
description = "Client data store, ported from packages/client/src/solid/data.ts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One integration-test binary (`tests/all`); a new `tests/<file>.rs` is a module of it, not a binary of its own.
autotests = false

[lints]
workspace = true

[dependencies]
futures-util.workspace = true
indexmap.workspace = true
log.workspace = true
xiaochuan-api.workspace = true
xiaochuan-util.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
bytes.workspace = true
xiaochuan-local.workspace = true
xiaochuan-service.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "all"
path = "tests/all/main.rs"
